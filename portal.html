<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micro Dramas en Español</title>
    <link rel="stylesheet" href="/portal.css">
</head>
<body>
    <main class="portal-screen">
        <img src="/assets/micro_drama_en_español_1.jpg" alt="Micro Dramas en Español" class="portal-logo">

        <section class="portal-card" aria-label="Cuenta de usuario">
            <div id="auth-message" class="auth-message" hidden></div>

            <section id="login-panel" class="panel">
                <h1>Iniciar sesión</h1>
                <p class="panel-subtitle">Accede a tu cuenta para entrar a la cartelera.</p>

                <form id="login-form" novalidate>
                    <label for="login-identifier">Correo</label>
                    <input id="login-identifier" type="email" autocomplete="username" placeholder="correo@ejemplo.com" required>

                    <label for="login-password">Contraseña</label>
                    <input id="login-password" type="password" autocomplete="current-password" placeholder="Tu contraseña" required>

                    <button id="login-submit" class="primary-button" type="submit">Iniciar sesión</button>
                </form>

                <button id="go-forgot" class="text-button" type="button">¿Olvidaste tu contraseña?</button>
                <div class="panel-divider"><span>o</span></div>
                <button id="go-register" class="secondary-button" type="button">Crear una cuenta</button>
            </section>

            <section id="register-panel" class="panel" hidden>
                <h1>Crear cuenta</h1>
                <p class="panel-subtitle">Regístrate con tu correo y crea tu contraseña.</p>

                <form id="register-form" novalidate>
                    <label for="register-name">Nombre</label>
                    <input id="register-name" type="text" autocomplete="name" placeholder="Tu nombre" maxlength="60" required>

                    <label for="register-identifier">Correo</label>
                    <input id="register-identifier" type="email" autocomplete="email" placeholder="correo@ejemplo.com" required>

                    <label for="register-password">Contraseña</label>
                    <input id="register-password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                    <p class="password-hint">Debe contener mayúsculas, minúsculas, números y caracteres especiales. Mínimo 8 caracteres.</p>

                    <label for="register-confirm">Confirmar contraseña</label>
                    <input id="register-confirm" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" minlength="8" required>

                    <button id="register-submit" class="primary-button" type="submit">Crear cuenta</button>
                </form>

                <button id="register-go-login" class="text-button" type="button">Ya tengo una cuenta</button>
            </section>

            <section id="forgot-panel" class="panel" hidden>
                <h1>Restablecer contraseña</h1>
                <p class="panel-subtitle">Introduce el correo asociado a tu cuenta.</p>

                <form id="forgot-form" novalidate>
                    <label for="forgot-identifier">Correo</label>
                    <input id="forgot-identifier" type="email" autocomplete="username" placeholder="correo@ejemplo.com" required>

                    <label for="forgot-password">Nueva contraseña</label>
                    <input id="forgot-password" type="password" autocomplete="new-password" placeholder="Mínimo 8 caracteres" minlength="8" required>

                    <label for="forgot-confirm">Confirmar contraseña</label>
                    <input id="forgot-confirm" type="password" autocomplete="new-password" placeholder="Repite tu contraseña" minlength="8" required>

                    <button id="forgot-submit" class="primary-button" type="submit">Cambiar contraseña</button>
                </form>

                <button id="forgot-go-login" class="text-button" type="button">Volver a iniciar sesión</button>
            </section>

            <section id="profile-panel" class="panel" hidden>
                <div class="profile-heading">
                    <img id="profile-avatar-img" src="/assets/avatar-1.png" alt="Avatar">
                    <div>
                        <h1 id="profile-name">Usuario</h1>
                        <p id="profile-account" class="panel-subtitle"></p>
                    </div>
                </div>

                <form id="profile-form" novalidate>
                    <label for="profile-display-name">Nombre</label>
                    <input id="profile-display-name" type="text" maxlength="60" required>

                    <label>Elegir avatar</label>
                    <div id="avatar-options" class="avatar-options"></div>
                    <button class="primary-button" type="submit">Guardar perfil</button>
                </form>

                <button id="enter-catalog" class="catalog-button" type="button">Entrar a la cartelera</button>
                <button id="logout-button" class="text-button danger-button" type="button">Cerrar sesión</button>
            </section>
        </section>
    </main>
    <script src="/portal.js"></script>
</body>
</html>
