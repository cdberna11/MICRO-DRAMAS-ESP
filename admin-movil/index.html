<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Administración móvil | Micro Dramas ESP</title>
    <link rel="stylesheet" href="/admin-movil/mobile.css?v=20260825-4">
    <link rel="stylesheet" href="/admin-movil/mobile-list.css?v=20260825-1">
</head>
<body>
<header class="admin-header">
    <div class="admin-header__content">
        <h1>Micro Dramas ESP</h1>
        <button id="boton-salir-admin" class="admin-mobile-exit" type="button">Salir</button>
    </div>
</header>

<main class="admin-main">
    <section class="admin-panel" aria-label="Lista administrativa de microdramas">
        <div id="estado-carga" class="loading-state" aria-live="polite">Cargando microdramas...</div>

        <div id="contenedor-busqueda" class="admin-search" hidden>
            <div class="admin-search__input-wrapper">
                <span class="admin-search__icon" aria-hidden="true">🔎</span>
                <input
                    type="search"
                    id="buscador-dramas"
                    class="admin-search__input"
                    placeholder="Buscar por nombre, ID, plataforma, categoría o estado..."
                    autocomplete="off"
                >
                <button id="boton-limpiar-busqueda" class="admin-search__clear" type="button" hidden aria-label="Limpiar búsqueda">×</button>
            </div>
            <div id="resultado-busqueda" class="admin-search__result" aria-live="polite"></div>
        </div>

        <div id="contenedor-tabla" class="table-container" hidden>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Microdrama</th>
                        <th>Plataforma</th>
                        <th>Categoría</th>
                        <th>Sin enlace MEGA</th>
                        <th>Estado</th>
                        <th>Destacado</th>
                        <th>Orden</th>
                        <th>Actualización</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-dramas"></tbody>
            </table>
        </div>

        <div id="estado-vacio" class="empty-state" hidden>No hay microdramas registrados.</div>
    </section>
</main>

<script src="/admin-movil/mobile-boot.js?v=20260825-4"></script>
<script src="/admin-movil/mobile-admin.js?v=20260825-1"></script>
</body>
</html>
