<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Administración móvil | Micro Dramas ESP</title>
    <link rel="stylesheet" href="/admin-movil/mobile.css?v=20261104-compact-search">
    <link rel="stylesheet" href="/admin-movil/mobile-list.css?v=20261104-compact-search">
</head>
<body>
<header class="admin-header">
    <div class="admin-header__content">
        <h1>Micro Dramas ESP</h1>
        <button id="boton-salir-admin" class="admin-mobile-exit" type="button">Salir</button>
    </div>
</header>

<main class="admin-main">
    <section class="admin-panel" aria-label="Lista administrativa de microdramas">
        <div id="estado-carga" class="loading-state" aria-live="polite">Cargando microdramas...</div>

        <section id="contenedor-busqueda" class="admin-search admin-mobile-search" hidden aria-label="Búsqueda combinada">
            <div class="admin-search__bar-row">
                <div class="admin-search__input-wrapper">
                    <svg class="admin-search__icon" viewBox="0 0 24 24" aria-hidden="true">
                        <circle cx="11" cy="11" r="7"/>
                        <path d="m20 20-4-4"/>
                    </svg>
                    <input
                        type="text"
                        id="buscador-dramas"
                        class="admin-search__input"
                        placeholder="Combina título, ID, plataforma, categoría, estado u otras palabras..."
                        autocomplete="off"
                        inputmode="search"
                        enterkeyhint="search"
                        role="searchbox"
                        aria-label="Buscar microdramas"
                    >
                    <button id="boton-limpiar-busqueda" class="admin-search__clear" type="button" hidden aria-label="Limpiar búsqueda" title="Limpiar búsqueda">×</button>
                </div>
            </div>
            <div id="resultado-busqueda" class="admin-search__result" aria-live="polite"></div>
        </section>

        <div id="contenedor-tabla" class="table-container" hidden>
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Microdrama</th>
                        <th>Enlace MEGA</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="lista-dramas"></tbody>
            </table>
        </div>

        <div id="estado-vacio" class="empty-state" hidden>No hay microdramas registrados.</div>
    </section>
</main>

<script src="/admin-movil/mobile-boot.js?v=20260825-4"></script>
<script src="/admin-movil/mobile-admin.js?v=20261104-compact-search"></script>
</body>
</html>
