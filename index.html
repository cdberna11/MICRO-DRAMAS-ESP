<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MICRO DRAMAS EN ESPAÑOL
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="stylesheet"
        href="category-menu-fix.css"
    >

    <link
        rel="stylesheet"
        href="mobile-bottom-nav.css"
    >

    <link
        rel="stylesheet"
        href="catalog-user.css"
    >

</head>

<body>

    <!-- =====================================================
         USUARIO LOGUEADO — SOLO ESCRITORIO
    ====================================================== -->

    <div
        id="catalog-user-menu"
        class="catalog-user-menu"
        hidden
    >

        <button
            id="catalog-user-button"
            class="catalog-user-button"
            type="button"
            aria-label="Abrir menú de usuario"
            aria-expanded="false"
        >
            <span class="catalog-user-identity">
                <img
                    id="catalog-user-avatar"
                    class="catalog-user-avatar"
                    src="assets/avatar-1.png"
                    alt="Avatar del usuario"
                >
                <span
                    id="catalog-user-name"
                    class="catalog-user-name"
                >
                    Usuario
                </span>
            </span>
        </button>

        <div
            id="catalog-user-dropdown"
            class="catalog-user-dropdown"
            hidden
        >
            <button
                id="catalog-user-logout"
                class="catalog-user-logout"
                type="button"
            >
                Cerrar sesión
            </button>
        </div>

    </div>


    <!-- =====================================================
         CABECERA
    ====================================================== -->

    <header class="site-header">
        <div class="site-header__content">

            <img
                src="assets/micro_drama_en_español_1.jpg"
                alt="Micro Dramas en Español"
                class="site-logo"
            >

        </div>
    </header>


    <!-- =====================================================
         CONTENIDO PRINCIPAL
    ====================================================== -->

    <main class="site-main">

        <section class="catalog-section">
            <div
                id="catalogo"
                class="catalog-carousel"
                aria-label="Catálogo de microdramas"
            ></div>
        </section>

    </main>


    <!-- =====================================================
         APLICACIÓN PRINCIPAL
    ====================================================== -->

    <script src="app.js"></script>

    <!--
         Correcciones aisladas del reproductor.
         Debe cargarse DESPUÉS de app.js para sustituir
         únicamente las rutas SEEK/fullscreen defectuosas.
    -->
    <script src="player-seek-fix.js?v=3"></script>

    <!-- Navegación móvil existente -->
    <script src="mobile-bottom-nav.js"></script>


    <!-- =====================================================
         USUARIO DE LA CARTELERA — ESCRITORIO
    ====================================================== -->

    <script>
        (async function cargarUsuarioCatalogo() {

            const menu = document.getElementById(
                "catalog-user-menu"
            );

            const button = document.getElementById(
                "catalog-user-button"
            );

            const dropdown = document.getElementById(
                "catalog-user-dropdown"
            );

            const avatar = document.getElementById(
                "catalog-user-avatar"
            );

            const name = document.getElementById(
                "catalog-user-name"
            );

            const logout = document.getElementById(
                "catalog-user-logout"
            );

            if (
                !menu ||
                !button ||
                !dropdown ||
                !avatar ||
                !name ||
                !logout
            ) {
                return;
            }

            try {

                const response = await fetch(
                    "/api/auth/me",
                    {
                        method: "GET",
                        credentials: "same-origin",
                        cache: "no-store",
                        headers: {
                            "Accept": "application/json"
                        }
                    }
                );

                const data = await response.json().catch(
                    () => ({})
                );

                if (
                    !response.ok ||
                    !data.authenticated ||
                    !data.user
                ) {
                    return;
                }

                avatar.src =
                    `/assets/${encodeURIComponent(
                        data.user.avatar || "avatar-1.png"
                    )}`;

                const displayName =
                    String(
                        data.user.displayName ||
                        data.user.name ||
                        "Usuario"
                    ).trim() || "Usuario";

                name.textContent = displayName;
                avatar.alt = `Avatar de ${displayName}`;
                menu.hidden = false;

                button.addEventListener(
                    "click",
                    event => {
                        event.stopPropagation();

                        const abierto =
                            menu.classList.toggle(
                                "is-open"
                            );

                        dropdown.hidden = !abierto;

                        button.setAttribute(
                            "aria-expanded",
                            String(abierto)
                        );
                    }
                );

                document.addEventListener(
                    "click",
                    event => {
                        if (!menu.contains(event.target)) {
                            menu.classList.remove(
                                "is-open"
                            );

                            dropdown.hidden = true;

                            button.setAttribute(
                                "aria-expanded",
                                "false"
                            );
                        }
                    }
                );

                logout.addEventListener(
                    "click",
                    () => {
                        window.location.href =
                            "/api/session/logout";
                    }
                );

            } catch (error) {

                console.error(
                    "No se pudo cargar el usuario de la cartelera:",
                    error
                );

            }

        })();
    </script>

</body>

</html>
