<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        MICRO DRAMAS EN ESPAÑOL
    </title>

    <link
        rel="stylesheet"
        href="/portal.css"
    >

</head>


<body>

    <!-- =====================================================
         PANTALLA DE SELECCIÓN DE USUARIO
    ====================================================== -->

    <main class="portal-screen">


        <!-- =================================================
             LOGO
        ================================================== -->

        <img
            src="/assets/micro_drama_en_español_1.jpg"
            alt="Micro Dramas en Español"
            class="portal-logo"
        >


        <!-- =================================================
             TÍTULO
        ================================================== -->

        <h1 class="portal-title">
            ¿QUIÉN ESTÁ VIENDO?
        </h1>


        <!-- =================================================
             PERFIL INVITADO
        ================================================== -->

        <section class="profiles">

            <a
    href="/api/session/login"
    class="profile-card"
    aria-label="Entrar como Invitado"
>

                <div class="profile-avatar">

                    <img
                        src="/assets/avatar-1.png"
                        alt="Invitado"
                    >

                </div>


                <div class="profile-name">
                    Invitado
                </div>

            </a>

        </section>


    </main>


</body>

</html>
