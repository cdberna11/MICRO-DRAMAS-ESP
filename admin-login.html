<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Acceso administrativo | Micro Dramas ESP</title>
    <link rel="stylesheet" href="/admin/admin-login.css?v=20260819-5">
    <style>
        * { box-sizing: border-box; }
        [hidden] { display: none !important; }
        html, body { min-height: 100%; }
        body { margin: 0; font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f7f7f8; background: radial-gradient(circle at 50% 0%, rgba(255, 25, 40, .14), transparent 38%), #080b10; }
        .admin-login-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
        .admin-login-card { width: min(100%, 460px); padding: 32px; border: 1px solid #252b35; border-radius: 20px; background: rgba(16, 20, 27, .96); box-shadow: 0 24px 70px rgba(0, 0, 0, .45); }
        .admin-login-brand { text-align: center; margin-bottom: 24px; }
        .admin-login-brand img { display: block; width: min(250px, 75%); height: auto; max-height: 72px; margin: 0 auto; object-fit: contain; border-radius: 8px; -webkit-mask-image: radial-gradient(ellipse at center, #000 42%, rgba(0,0,0,.92) 57%, transparent 82%); mask-image: radial-gradient(ellipse at center, #000 42%, rgba(0,0,0,.92) 57%, transparent 82%); }
        .admin-login-heading { text-align: center; }
        .admin-login-badge { display: inline-block; padding: 6px 10px; border: 1px solid #39414e; border-radius: 999px; color: #aeb8c8; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
        .admin-login-heading h1 { margin: 14px 0 8px; font-size: 30px; line-height: 1.2; }
        .admin-login-heading p { margin: 0 auto 26px; color: #aeb5c0; line-height: 1.5; font-size: 14px; }
        .admin-login-form label { display: block; margin: 0 0 8px; font-weight: 650; font-size: 14px; }
        .admin-login-form input { width: 100%; min-height: 48px; border: 1px solid #343c49; border-radius: 10px; padding: 0 14px; background: #0d1117; color: #fff; outline: none; font-size: 16px; }
        .admin-login-form input:focus { border-color: #f0192c; box-shadow: 0 0 0 3px rgba(240, 25, 44, .12); }
        .admin-login-button, .admin-login-secondary { width: 100%; min-height: 48px; border-radius: 10px; border: 1px solid transparent; margin-top: 14px; font-size: 15px; font-weight: 700; cursor: pointer; }
        .admin-login-button { background: #ed1628; color: #fff; }
        .admin-login-button:hover { background: #ff1e31; }
        .admin-login-button:disabled { opacity: .6; cursor: wait; }
        .admin-login-secondary { background: #171c24; color: #dbe1ea; border-color: #303846; }
        .admin-pin-actions { display: grid; grid-template-columns: .75fr 1.25fr; gap: 10px; }
        .admin-login-user { margin: 0 0 18px; padding: 11px 13px; border-radius: 10px; background: #121720; color: #cbd3df; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
        .admin-login-message { margin-top: 16px; padding: 12px 13px; border-radius: 10px; background: #251218; border: 1px solid #59212c; color: #ffb8c0; font-size: 14px; line-height: 1.4; }
        .admin-login-catalog { display: block; margin-top: 22px; text-align: center; color: #aeb8c8; text-decoration: none; font-size: 14px; }
        .admin-login-catalog:hover { color: #fff; }
        @media (max-width: 520px) { .admin-login-page { padding: 14px; } .admin-login-card { width: min(100%, 460px); padding: 24px 20px; border-radius: 16px; } .admin-login-brand { margin-bottom: 20px; } .admin-login-brand img { width: min(220px, 78%); max-height: 64px; } .admin-login-heading h1 { font-size: 26px; } .admin-login-heading p { font-size: 13px; margin-bottom: 22px; } .admin-login-form input, .admin-login-button, .admin-login-secondary { min-height: 50px; } }
    </style>
</head>
<body>
    <main class="admin-login-page">
        <section class="admin-login-card" aria-labelledby="admin-login-title">
            <div class="admin-login-brand"><img src="/assets/micro_drama_en_español_1.jpg" alt="Micro Dramas en Español"></div>
            <div class="admin-login-heading"><span class="admin-login-badge">PANEL ADMINISTRATIVO</span><h1 id="admin-login-title">Iniciar sesión</h1><p id="admin-login-description">Utiliza la misma cuenta de la cartelera. Solo los usuarios con permisos de administrador pueden entrar.</p></div>
            <form id="admin-login-form" class="admin-login-form" novalidate>
                <div id="admin-step-identifier">
                    <label for="admin-identifier">Correo electrónico o teléfono</label>
                    <input id="admin-identifier" name="identifier" type="text" autocomplete="username" inputmode="email" placeholder="correo@ejemplo.com" required>
                    <button id="admin-continue" class="admin-login-button" type="submit">Continuar</button>
                </div>
                <div id="admin-step-pin" hidden>
                    <div class="admin-login-user" id="admin-login-user"></div>
                    <label for="admin-pin">PIN de acceso</label>
                    <input id="admin-pin" name="pin" type="password" inputmode="numeric" autocomplete="current-password" maxlength="4" pattern="[0-9]{4}" placeholder="••••">
                    <div class="admin-pin-actions"><button id="admin-back" class="admin-login-secondary" type="button">Volver</button><button id="admin-submit-pin" class="admin-login-button" type="submit">Entrar al administrador</button></div>
                </div>
                <div id="admin-login-message" class="admin-login-message" role="alert" hidden></div>
            </form>
            <a class="admin-login-catalog" href="/">← Volver a la cartelera</a>
        </section>
    </main>
    <script src="/admin-login.js?v=20260825-1" defer></script>
</body>
</html>
