<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow, noarchive">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Administración móvil | Micro Dramas ESP</title>
    <link rel="stylesheet" href="/admin-movil/mobile.css?v=20260825-2">
</head>
<body class="admin-mobile-only">
<header class="admin-mobile-header">
    <div class="admin-mobile-header__content">
        <h1>Micro Dramas ESP</h1>
        <button id="boton-salir-admin" class="mobile-button mobile-button--secondary" type="button">Salir</button>
    </div>
</header>

<main class="admin-mobile-main">
<section class="admin-mobile-panel" aria-label="Administración de microdramas">
    <div id="mensaje-admin" class="mobile-message" role="status" aria-live="polite" hidden></div>

    <div id="estado-carga" class="mobile-loading" aria-live="polite">Cargando microdramas...</div>

    <div id="contenedor-busqueda" class="mobile-search" hidden>
        <div class="mobile-search__input-wrapper">
            <span class="mobile-search__icon" aria-hidden="true">🔎</span>
            <input type="search" id="buscador-dramas" class="mobile-search__input" placeholder="Buscar por nombre, ID, plataforma, categoría o estado..." autocomplete="off">
            <button id="boton-limpiar-busqueda" class="mobile-search__clear" type="button" hidden aria-label="Limpiar búsqueda">×</button>
        </div>
        <div id="resultado-busqueda" class="mobile-search__result" aria-live="polite"></div>
    </div>

    <div id="contenedor-tabla" class="mobile-table-container" hidden>
        <table class="mobile-admin-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Microdrama</th>
                    <th>Plataforma</th>
                    <th>Categoría</th>
                    <th>Sin enlace MEGA</th>
                    <th>Estado</th>
                    <th>Destacado</th>
                    <th>Orden</th>
                    <th>Actualización</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody id="lista-dramas"></tbody>
        </table>
    </div>

    <div id="estado-vacio" class="mobile-empty" hidden>No hay microdramas registrados.</div>
</section>
</main>

<script src="/admin/admin.js?v=20260825-mobile-list" defer></script>
<script src="/admin/admin-enhancements.js?v=20260825-mobile-list" defer></script>
<script src="/admin/admin-logout.js?v=20260825-mobile-list" defer></script>
<script src="/admin-movil/mobile-boot.js?v=20260825-2" defer></script>
</body>
</html>
